<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>openrig studio</title>
<style>
  :root {
    --ink: #121214; --panel: rgba(255,255,255,.025); --edge: rgba(255,255,255,.10);
    --edge2: rgba(255,255,255,.16); --bone: rgba(255,255,255,.95); --dim: rgba(255,255,255,.52);
    --body: rgba(255,255,255,.68); --faint: rgba(255,255,255,.38); --red: #ff6b5a;
    --sans: Helvetica, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--ink); font-family: var(--sans); }
  /* THE RAIL IS FULL HEIGHT AND THE HEADER STARTS BESIDE IT. The header used to
     span the whole width with the rail beneath it, which read as two separate
     bands and put the launcher's collapse control in the header rather than on
     the thing it collapses. Now the launcher is one continuous edge from the top
     of the window, and the header belongs to the surface it sits above. */
  #app { display: flex; flex-direction: row; height: 100vh; }
  #maincol { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
  /* THE TWO PERSISTENT FRAMES. Every surface gets the same launcher on the left
     and the same header on top, so the studio reads as one application rather
     than a set of pages that each invented their own chrome. A surface renders
     inside them and does not draw either. */
  #shellframes { display: flex; flex: 1; min-height: 0; }
  #topbar { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 46px;
    background: var(--panel); border-bottom: 1px solid var(--edge); flex: none; }
  #topbar .title { color: var(--bone); font-weight: 700; letter-spacing: .22em; font-size: 12px; }
  #topbar .crumb { color: var(--faint); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  /* THE HEADER IS SPLIT: the left half is the APP's, the right half is the SHELL's.
     An app declares what goes in its half; it never draws chrome, and it cannot
     reach into the shell's. That boundary is what closes the two-headers problem
     in the contract rather than by asking every app to delete something. */
  #appHalf { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  #shellHalf { display: flex; align-items: center; gap: 8px; flex: none; }
  #appActions { display: flex; align-items: center; gap: 6px; flex: none; }
  #topbar button { background: none; border: 1px solid var(--edge2); border-radius: 2px;
    color: var(--body); font: inherit; font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 600; padding: 7px 12px; cursor: pointer; }
  #topbar button:hover { color: var(--bone); border-color: var(--bone); }
  #topbar button.on { background: var(--bone); border-color: var(--bone); color: #111; }
  /* Lives on the rail now, not in the header: a control belongs to the thing it
     acts on, and in the header it read as a studio-level control beside MARKUP
     and AGENTS when it is only ever about the launcher. */
  #railToggle { flex: none; width: 26px; height: 24px; padding: 0; display: inline-flex;
    align-items: center; justify-content: center;
    background: none; border: 1px solid var(--edge2); border-radius: 2px; color: var(--faint);
    cursor: pointer; font: inherit; font-size: 12px; line-height: 1; }
  #railToggle:hover { color: var(--bone); border-color: var(--bone); }
  /* Collapsed, the filled column flips to the right: the same glyph now reads as
     "open this" rather than "close it". One glyph, one meaning per state, and no
     JS reaching into the button's contents. */
  body.rail-collapsed #railToggle svg { transform: scaleX(-1); }
  #rail { width: 212px; min-width: 212px; background: var(--panel); border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; }
  /* COLLAPSE TO A TOOLSTRIP, not to nothing. Small screens and wide work want the
     room back, but a launcher you cannot see is one you cannot use — the glyphs
     stay, and they are already in the markup, so this is presentation only. */
  body.rail-collapsed #rail { width: 52px; min-width: 52px; }
  body.rail-collapsed #rail-head small,
  body.rail-collapsed #rail-foot,
  body.rail-collapsed #manifest-health,
  body.rail-collapsed .tab .name,
  body.rail-collapsed .tab .dot { display: none; }
  /* Collapsed, the toggle is the only thing left in the head, so it centres
     rather than sitting against a title that is no longer rendered. */
  body.rail-collapsed #rail-head { justify-content: center; padding: 16px 0 10px; }
  body.rail-collapsed #rail-head .headtext { display: none; }
  body.rail-collapsed #tabs { padding: 6px 4px; }
  body.rail-collapsed .tab { justify-content: center; padding: 9px 0; }
  body.rail-collapsed .tab .glyph { width: auto; }
  /* Toggle to the RIGHT: the head reads title-then-control, and the control sits
     on the outer edge where a collapse affordance is looked for. */
  #rail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 20px 16px 10px; color: var(--bone); font-weight: 700; letter-spacing: 3px; font-size: 11.5px; }
  /* 11.5/3 rather than 13/4: at the rail's 212px the longer name wrapped to two
     lines and the toggle beside it aligned to the first, which read as a mistake.
     The wide tracking is the studio's own language, so it is kept and the size
     gives way — measured, not guessed. */
  #rail-head .headtext { white-space: nowrap; }
  #rail-head .headtext { flex: 1; min-width: 0; display: block; }
  #rail-head small { display: block; color: var(--faint); font-weight: 400; letter-spacing: .14em;
    font-size: 9.5px; margin-top: 5px; text-transform: uppercase; }
  #tabs { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; margin: 2px 0;
    border: 1px solid transparent; border-radius: 2px; background: none; color: var(--body); cursor: pointer;
    font: inherit; font-size: 12.5px; text-align: left; }
  .tab:hover { color: var(--bone); border-color: var(--edge2); }
  .tab.active { color: #111; background: var(--bone); border-color: var(--bone); font-weight: 600; }
  .tab .glyph { font-size: 14px; width: 18px; text-align: center; }
  .tab .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--edge2); flex: none; }
  .tab .dot.live { background: var(--bone); box-shadow: 0 0 6px rgba(255,255,255,.5); }
  .tab.active .dot.live { background: #111; }
  .tab .dot.down { background: var(--red); }
  #manifest-health { padding: 8px 16px; font-size: 10px; letter-spacing: .06em; color: var(--faint); }
  #manifest-health.bad { color: var(--red); }
  /* A slot in the rail, above its foot, for a deployment's own control (a server hook's shell transform fills it, or
     places beside it). Empty, it takes no room. */
  #rail-private { padding: 8px 8px 10px; }
  #rail-private:empty { display: none; }
  body.rail-collapsed #rail-private { padding: 8px 4px 10px; }
  /* One notice over the whole page when the sign-in in front of this Studio has ended (see the sign-in renewal). */
  #signInEnded { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .6); }
  #signInEnded > div { box-sizing: border-box; width: 100%; max-width: 420px; padding: 22px 24px; border: 1px solid var(--edge2); border-radius: 8px; background: var(--ink); color: var(--bone); font-size: 15px; line-height: 1.45; }
  #signInEnded h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  #signInEnded p { margin: 0 0 16px; }
  #signInEnded button { padding: 8px 14px; font: inherit; color: var(--bone); background: transparent; border: 1px solid var(--edge2); border-radius: 6px; cursor: pointer; }
  #signInEnded button:hover, #signInEnded button:focus-visible { border-color: var(--bone); }
  #rail-foot { padding: 14px 16px 16px; border-top: 1px solid var(--edge); color: var(--faint);
    font-size: 10px; line-height: 1.6; display: flex; flex-direction: column; gap: 7px; }
  /* currentColor, so the mark is the same ink as the text around it and there is
     no second palette to keep in step. Inlined rather than fetched: the shell has
     no asset route, and a logo that 404s is a broken-looking product. */
  #rail-foot .wordmark { width: 104px; height: auto; display: block; color: var(--bone); opacity: .92; }
  #rail-foot .markLink { display: block; }
  #rail-foot .markLink:hover .wordmark { opacity: 1; }
  #rail-foot .tagline { color: var(--faint); }
  #rail-foot .links a { color: var(--dim); text-decoration: none; }
  #rail-foot .links a:hover { color: var(--bone); text-decoration: underline; }
  #stage { flex: 1; position: relative; background: var(--ink); }
  /* The stage's own frames only: a chat panel mounted in the stage lays out its frames itself. */
  #stage > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--ink); }
  #stage > iframe.hidden { visibility: hidden; pointer-events: none; }
  /* An idle overlay must not eat clicks meant for the surface. A feature that
     wants input sets pointer-events on its own node inside this host. */
  #shell-overlay { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
  /* When the app list couldn't be read, or there's nothing on it: a card that says which, in plain words, never an empty rail
     that looks like an empty workspace. */
  #empty:has(.why) { padding: 0 16px; }
  #empty .why { box-sizing: border-box; width: 100%; max-width: 420px; padding: 20px 22px; border: 1px solid var(--edge2); border-radius: 4px; text-transform: none;
    letter-spacing: normal; font-size: 14px; line-height: 1.5; color: var(--dim); }
  #empty .why strong { display: block; margin-bottom: 6px; color: var(--bone); font-weight: 600; }
  #empty .why span { display: block; }
  #empty .why .help { margin-top: 8px; color: var(--faint); font-size: 13px; }
  #empty .why .acts { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  #empty .why button, #empty .why .acts a { padding: 6px 12px; font: inherit; font-size: 13px; color: var(--bone); text-decoration: none;
    background: transparent; border: 1px solid var(--edge2); border-radius: 4px; cursor: pointer; }
  #empty .why button:hover, #empty .why .acts a:hover { border-color: var(--bone); }
  /* ---- the agent sidebar ----
     Measurements ported from the shell this was extracted from, where they
     survived a week of daily use. 400px is not arbitrary: a terminal at this
     font size needs it to avoid wrapping an agent's output into noise, and the
     earlier 320px guess is what made the pane feel cramped. */
  /* Never wider than its column: on a phone a fixed 400px minimum beside the main column pushed the page past the screen.
     The minimum is the smaller of 400px and the column, so it's unchanged wherever the column is 400px or wider. */
  #agents { width: 400px; min-width: min(400px, 100%); display: none; flex-direction: column;
    border-left: 1px solid var(--edge); background: var(--panel); backdrop-filter: blur(14px);
    min-height: 0; }
  #agents.open { display: flex; }
  #agents-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-bottom: 1px solid var(--edge); flex: 0 0 auto; }
  #agents-head .word { color: var(--bone); font-size: 9.5px; letter-spacing: .22em;
    font-weight: 700; cursor: pointer; }
  #agents-head .word:hover { color: var(--dim); }
  #chatRigSel { background: rgba(255,255,255,.04); color: var(--dim); border: 1px solid var(--edge);
    border-radius: 2px; font: 9px var(--sans); letter-spacing: .14em; text-transform: uppercase;
    padding: 3px 6px; cursor: pointer; appearance: none;
    /* A flex item's automatic minimum is its longest option, so a long rig name held the header wider than a narrow
       column. It may shrink; the open list still shows the full name. */
    min-width: 0; }
  #chatRigSel:hover { color: var(--bone); border-color: var(--edge2); }
  #seatName { flex: 1; color: var(--faint); font-size: 10px; letter-spacing: .04em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  #seatTiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    padding: 6px 8px 8px; border-bottom: 1px solid var(--edge); flex: 0 0 auto; }
  #seatTiles:empty { display: none; }
  .seatTile { background: rgba(255,255,255,.04); border: 1px solid var(--edge2);
    border-radius: 2px; color: var(--body); font: inherit; font-size: 9px;
    letter-spacing: .1em; padding: 7px 2px; cursor: pointer; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-transform: uppercase; }
  .seatTile:hover { color: var(--bone); border-color: rgba(255,255,255,.35); }
  .seatTile.active { color: #111; background: var(--bone); border-color: var(--bone);
    font-weight: 600; }
  /* Configured but not running. Dimmed and not-allowed rather than hidden: the
     roster is what this box is CONFIGURED with, so a stopped member disappearing
     would turn that into "who happens to be alive this second" and make the
     panel shrink silently when something dies. It stays visible and says why. */
  .seatTile.down { color: var(--faint); border-style: dashed; cursor: not-allowed; }
  .seatTile.down:hover { color: var(--faint); border-color: var(--edge2); }
  .seatTile .st { display: block; font-size: 7.5px; letter-spacing: .08em; opacity: .7;
    margin-top: 3px; }
  /* flex:1 with min-height:0 is what actually bounds the terminal. Without the
     min-height a flex child refuses to shrink below its content, so the iframe
     grew to whatever height xterm asked for and pushed the prompt off-screen —
     the pane looked pinned tall and the input was unreachable. */
  #chatframe { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #0a0a0c; }
  #chatframe:not([src]) { display: none; }
  #agents-body { padding: 14px; color: var(--body); font-size: 12px; line-height: 1.6;
    overflow: auto; flex: 0 1 auto; }
  #agents-body:empty { display: none; }
  #agents-body .seatrow { padding: 8px 10px; border: 1px solid var(--edge2); border-radius: 2px; margin-bottom: 6px; }
  #agents-body .honest { color: var(--faint); font-size: 10.5px; margin-top: 10px; }
  /* Lives in the header now. It used to float in the stage at position:absolute,
     which is why it sat ON TOP of the MARKUP button the first time this rendered —
     an absolutely positioned child does not participate in the flex row it was
     moved into. Styling comes from #topbar button; only the emphasis is local. */
  #agentToggle { flex: none; background: var(--bone); border-color: var(--bone); color: #111; }
  #agentToggle:hover { background: rgba(255,255,255,.8); border-color: var(--bone); color: #111; }
  /* hideAgents rows suppress the sidebar toggle while active (shell-protocol) */
  body.hide-agents #agentToggle { display: none !important; }
  /* Nothing to reach: the Studio says no chat panel is served here and no seats are declared, so the button would open
     an empty roster. */
  body.no-agent-route #agentToggle { display: none !important; }
  @media (max-width: 700px) {
    #topbar { height: auto; min-height: 46px; flex-wrap: wrap; padding: 8px; gap: 6px; }
    #appHalf { flex: 1 0 100%; gap: 8px; }
    #topCrumb { display: none; }
    #topTitle { max-width: 35%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #appActions { margin-left: auto; }
    #shellHalf { margin-left: auto; }
    #topbar button { min-height: 32px; padding: 6px; }
  }

  /* The phone drawer. Under 600px a phone's first look is the page: the rail is a drawer over it, closed until the menu
     button opens it, and it closes again on choosing a surface, on the scrim or on Escape. Closed, it's out of the tab order
     too. From 600px up nothing here applies, and the rail behaves as it does on any wider screen. */
  #navMenu, #navScrim { display: none; }
  @media (max-width: 599.98px) {
    #rail { position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; width: min(280px, 86vw) !important; min-width: 0 !important;
      transform: translateX(-102%); background: var(--ink); border-right: 1px solid var(--edge2);
      visibility: hidden; transition: transform .18s ease, visibility 0s linear .18s; }
    body.navDrawer #rail { transform: none; visibility: visible; transition: transform .18s ease, visibility 0s; }
    body.navDrawer #navScrim { display: block; position: fixed; inset: 0; z-index: 59; background: rgba(0, 0, 0, .55); }
    #rail #railToggle { display: none; }
    #navMenu { display: inline-flex; align-items: center; justify-content: center; flex: none; margin-right: 8px; padding: 6px 8px !important; }
  }

  /* The chat panel's conversation uses the stage; app documents stay mounted under it. */
  body.workspace-chat #rail { width:192px; min-width:192px; }
  body.workspace-chat.rail-collapsed #rail { width:52px; min-width:52px; }
  body.workspace-chat #rail-head { padding:16px 12px; min-height:64px; }
  body.workspace-chat #rail-head small { display:none; }
  body.workspace-chat #topbar { height:52px; min-height:52px; padding:4px 16px; }
  body.chat-workspace-visible #stage > iframe { visibility:hidden; pointer-events:none; }
  body.chat-workspace-visible #appActions, body.chat-workspace-visible #topCrumb { display:none; }
  body.chat-workspace-visible #markupToggle { display:none; }
  body.workspace-chat #stage { min-width:0; min-height:0; }
  @media(max-height:450px) { body.workspace-chat #topbar { height:44px; min-height:44px; padding:0 12px; } }
  @media(max-width:760px) { body.workspace-chat #rail { width:212px; min-width:212px; } }

  /* Opt-in full workspace canvas. Other surfaces retain the standard shell. */
  body.workspace-canvas { padding:0 !important; overflow:hidden; }
  body.workspace-canvas #rail, body.workspace-canvas #topbar,
  body.workspace-canvas #chat-panel, body.workspace-canvas #agents,
  body.workspace-canvas #navShade { display:none !important; }
  body.workspace-canvas #maincol, body.workspace-canvas #shellframes { margin:0; min-width:0; min-height:0; }
  body.workspace-canvas #stage { display:block !important; width:100%; height:100%; margin:0; padding:0; }
</style>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div id="rail-head">
      <span class="headtext">OPENRIG STUDIO<small id="railVersion">sdk —</small></span>
      <button id="railToggle" title="collapse the launcher to a toolstrip" aria-label="collapse the launcher">
        <!-- The conventional collapse-to-toolstrip glyph: a panel with its left
             column filled. A hamburger means "a menu is behind this" and this is
             not a menu, so it was saying the wrong thing in the right place. -->
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <rect x="1.25" y="2.75" width="13.5" height="10.5" rx="1.75"
                fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M6.25 3.4v9.2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M2.6 4.4h2.3v7.2H2.6z" fill="currentColor" opacity=".85"/>
        </svg>
      </button>
    </div>
    <div id="tabs"></div>
    <div id="manifest-health"></div>
    <div id="rail-private"></div>
    <div id="rail-foot">
      <a class="markLink" href="https://openrig.dev" target="_blank" rel="noopener"

0V574.0H3932.0V126.0H4100.0V0.0H3632.0Z"/><path d="M4546.0 -14.0Q4482.0 -14.0 4430.0 17.5Q4378.0 49.0 4347.0 112.0Q4316.0 175.0 4316.0 268.0V432.0Q4316.0 523.0 4349.5 586.0Q4383.0 649.0 4442.0 681.5Q4501.0 714.0 4578.0 714.0Q4658.0 714.0 4715.0 680.0Q4772.0 646.0 4802.0 588.5Q4832.0 531.0 4832.0 460.0V448.0H4700.0V460.0Q4700.0 523.0 4667.5 555.5Q4635.0 588.0 4576.0 588.0Q4521.0 588.0 4484.5 551.0Q4448.0 514.0 4448.0 422.0V274.0Q4448.0 112.0 4580.0 112.0Q4639.0 112.0 4669.5 144.0Q4700.0 176.0 4700.0 228.0H4532.0V354.0H4832.0V0.0H4712.0V78.0H4694.0Q4682.0 39.0 4648.0 12.5Q4614.0 -14.0 4546.0 -14.0Z"/></g></svg></a>
      <span class="tagline">Durable teams of coding agents.</span>

        <a href="https://openrig.dev" target="_blank" rel="noopener">openrig.dev</a>

  </nav>
  <div id="maincol">
  <header id="topbar">
    <div id="appHalf">
      <button type="button" id="navMenu" aria-label="Open menu" aria-expanded="false" aria-controls="rail"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <span class="title" id="topTitle">STUDIO</span>
      <span class="crumb" id="topCrumb"></span>
      <span id="appActions"></span>
    </div>
    <div id="shellHalf">
      <span id="demoMode" class="crumb" hidden>DEMO · EXAMPLE DATA</span>
      <button id="markupToggle" title="annotate this surface">MARKUP</button>
      <button id="agentToggle" title="the seat roster">AGENTS ▸</button>
    </div>
  </header>
  <div id="shellframes">
  <main id="stage"><div id="empty">Loading your apps…</div>
  </main>
  <aside id="agents">
    <div id="agents-head">
      <span class="word" id="agentsWord">AGENTS ▾</span>
      <select id="chatRigSel" title="which rig's seats fill the launcher"></select>
      <span id="seatName"></span>
    </div>
    <div id="seatTiles"></div>
    <div id="agents-body"></div>
    <iframe allow="clipboard-read; clipboard-write" id="chatframe" title="agent seat"></iframe>
  </aside>

</div>
<div id="navScrim"></div>
<script>
(async () => {
  // ============================================================================
  // SHELL STATE. EVERY MODULE-LEVEL const/let THIS FILE ADDS GOES HERE, ABOVE
  // EVERYTHING THAT COULD READ IT. THIS IS NOT A STYLE PREFERENCE.
  //
  // Four temporal dead zones have now shipped from this one file, all identical:
  // a binding declared next to the code that FIRES it — which is where it reads
  // most naturally — while a function defined earlier READS it during boot.
  // activate() runs while the shell starts, so anything it touches must already
  // exist by then.
  //
  // THE FAILURE IS WHY THIS DESERVES A RULE RATHER THAN CARE: it does not look
  // like a crash. The rail renders, the tabs render, the page is plainly alive —
  // and the header stays blank, because activate() threw halfway through. Three
  // of the four were found by something else being missing, never by the page
  // looking wrong.
  //
  // Declarations above their readers; startup work at the very bottom, which is
  // why the init block is where it is.
  //
  // MECHANISED, PARTLY, AND THE LIMIT IS STATED: test/shell-boot.test.mjs fails
  // when a module-level Map or Set is declared outside this block — which is what
  // all four faults were. It is NOT a TDZ prover and does not run the shell; a
  // scalar read early still slips past it. The genuine check is a browser that
  // fails when this page does not finish booting, and this SDK has no browser
  // dependency to do it with.
  // ============================================================================
  const surfaceListeners = new Set();
  const markupListeners = new Set();
  const refused = new Set();          // open-surface refusals already said once (open a surface at a place)
  const placed = new Map();           // surface id -> the fragment the shell last put its frame at, so Back can take it off again
  // "My layout moved — re-measure, but do NOT reload." A separate channel from
  // surfaceListeners on purpose: that one means the board CHANGED and reloads
  // records, which resets undo history. A surface whose canvas item moved wants
  // neither of those, it wants the geometry recomputed.
  const refreshListeners = new Set();
  // What each surface declared for its half of the header. The shell holds it, so
  // a surface that declares once on load keeps its header across a switch away and
  // back — it has no reason to speak twice, and reverting to manifest defaults
  // showed a stale crumb and no actions while the surface was unchanged.
  const declaredHeaders = new Map();
  // id -> the iframe showing that surface. Pre-existing shell state that lived
  // beside its first use; it belongs here with the rest for the same reason.
  const frames = new Map();
  // id -> the surface row a frame was loaded from, so a live app change reloads only the frames whose app changed.
  const loadedSurfaces = new Map();
  const workspaceLayouts = new Map();
  const workspaceRoutes = new Map();
  // surface id -> the sub-context that surface last declared, or absent.
  //
  // WHY THIS EXISTS: a surface id is not always fine enough. ARTIFACTS holds many
  // independent documents behind ONE id, so marks keyed on the id alone either
  // sit over the wrong document after a page change or collapse every document's
  // thread into one. The shell cannot work out what a surface's documents are —
  // only the surface knows — so the surface may refine the default, and the
  // default is the surface id for everything that says nothing.
  const declaredContexts = new Map();
  // surface id -> the id of a SAME-ORIGIN nested frame that surface wants marks
  // anchored inside. Separate from the context above and deliberately so: the
  // context says WHICH BOARD, this says WHERE TO LOOK. A surface can need one
  // without the other, and folding them into one field would force a surface with
  // a nested frame to invent document identities it does not have.
  const declaredTargets = new Map();
  // Scalars after the collections (test/shell-boot.test.mjs reads the block as the run of collections).
  // The chat panel, once mounted and contextual (see the chat panel below); null until then and without one.
  let appChat = null;
  // A reload for a renewed sign-in is already on its way (see the sign-in renewal below).
  let renewingSignIn = false;
  // Which open-app turn a project app's sign-in hop belongs to, so a later click cancels an earlier hop.
  let projectHop = 0;

  // --- contract meta first: the shell itself is a contract consumer -------
  let meta = null;
  try { meta = await (await fetch("/api/contract", { cache: "no-store" })).json(); } catch {}
  document.getElementById("demoMode").hidden = meta?.runtime?.flavor !== "reference-fixture";
  // The rail states which SDK is actually serving it. Pulled from the runtime's
  // own report rather than written into this page, because a version typed into
  // the thing it describes is the one nobody remembers to change. Unreachable
  // runtime leaves the em dash, which says "not known" instead of a stale number.
  {
    const v = meta?.runtime?.version;
    const el = document.getElementById("railVersion");
    if (el && v) el.textContent = `sdk v${v}`;
  }
  const health = document.getElementById("manifest-health");
  // BEGIN MANIFEST HEALTH
  // What the rail says about the manifest, at load and on every live check (the runtime is warn-first: it still serves
  // the valid rows when one app's row is bad).
  const showManifest = (m) => {
    if (!m.ok) {
      health.className = "bad";
      health.textContent = `manifest: ${(m.errors || []).length} error(s) — see /api/contract`;
    } else {
      health.className = "";
      health.textContent = (m.warnings || []).length ? `manifest ok · ${m.warnings.length} warning(s)` : "manifest ok";
    }
  };
  // END MANIFEST HEALTH
  if (!meta) { health.className = "bad"; health.textContent = "runtime unreachable"; }
  else showManifest(meta.manifest);

  // --- surfaces from the manifest (valid rows only are served) ------------
  // The read says what went wrong rather than swallowing it: the list, an empty list, refused (401/403), another HTTP error,
  // unreadable (not the expected JSON), or no answer at all (this page can't tell where it failed, so it doesn't guess).
  let reg = { surfaces: [] }, manifestProblem = null;
  const healthBefore = { className: health.className, text: health.textContent };
  health.className = ""; health.textContent = "reading the app list…";
  try {
    const r = await fetch("/surfaces.json", { cache: "no-store", credentials: "same-origin" });
    if (!r.ok) manifestProblem = { kind: r.status === 401 || r.status === 403 ? "refused" : "http", status: r.status };
    else {
      const j = await r.json();
      if (!j || typeof j !== "object" || Array.isArray(j) || !Array.isArray(j.surfaces)) manifestProblem = { kind: "unreadable" };
      else reg = j;
    }
  } catch (e) { manifestProblem = { kind: e instanceof SyntaxError ? "unreadable" : "unanswered" }; }
  // defense in depth: the runtime already serves valid rows only; still never
  // render a row that lacks a target (a path-less row would recurse into "/")
  const surfaces = (reg.surfaces || [])
    .filter((s) => s && s.id && (s.url || (typeof s.path === "string" && s.path.startsWith("/"))))
    .map((s) => s.url ? s : ({ ...s, url: location.origin + s.path }));
  // Rows dropped above are said, so a part of the list never passes for all of it.
  const unusable = (reg.surfaces || []).length - surfaces.length;
  {
    const words = {
      refused: ["Your apps couldn't load", "Your sign-in wasn't accepted, or it has ended. Sign in again, then try again."],
      http: ["Your apps couldn't load", `This workspace answered with an error${manifestProblem?.status ? ` (${manifestProblem.status})` : ""}. Try again in a moment.`],
      unreadable: ["Your apps couldn't load", "Your app list came back in a form this page can't read. Try again in a moment."],
      unanswered: ["Your apps couldn't load", "Your workspace didn't answer just now. Try again in a moment."],
    }[manifestProblem?.kind];
    // A list whose rows were all unusable is not an empty workspace: it failed, and says so.
    const allUnusable = !manifestProblem && !surfaces.length && unusable > 0;
    const [title, line] = words || (allUnusable ? ["Your apps couldn't load", "None of the apps on your list could be shown. Try again in a moment."]
      : surfaces.length ? [] : ["No apps here yet", "No apps are set up in this workspace yet."]);
    const failed = Boolean(manifestProblem) || allUnusable;
    if (manifestProblem) console.warn(`shell: app list ${manifestProblem.kind}${manifestProblem.status ? ` (${manifestProblem.status})` : ""}`);
    // Drawn at once; /api/studio/place only refines it afterwards. A hosted Studio (one someone else set up) adds who to
    // ask and, when its place names an account page, a way to sign in again; a local one keeps the error code on the rail
    // for whoever runs it.
    const draw = (hosted, accountHref) => {
      if (title) {
        const card = document.createElement("div"); card.className = "why"; card.setAttribute("role", failed ? "alert" : "status");
        const t = document.createElement("strong"); t.textContent = title;
        const l = document.createElement("span"); l.textContent = line;
        card.append(t, l);
        if (hosted && manifestProblem?.kind !== "refused") {
          const h = document.createElement("span"); h.className = "help";
          h.textContent = failed ? "If it keeps happening, contact the person who set up your workspace." : "To add apps, contact the person who set up your workspace.";
          card.append(h);
        }
        const acts = document.createElement("div"); acts.className = "acts";
        if (manifestProblem?.kind === "refused" && typeof accountHref === "string" && /^https:\/\//.test(accountHref)) {
          const a = document.createElement("a"); a.href = accountHref; a.textContent = "Sign in again"; acts.append(a);
        }
        if (failed) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Try again"; b.onclick = () => location.reload(); acts.append(b); }
        if (acts.children.length) card.append(acts);
        document.getElementById("empty").replaceChildren(card);
      }
      if (manifestProblem) {
        if (hosted) { health.className = ""; health.textContent = ""; }
        else { health.className = "bad"; health.textContent = `app list: ${manifestProblem.kind}${manifestProblem.status ? ` (${manifestProblem.status})` : ""}`; }
      } else if (unusable > 0) {
        health.className = hosted ? "" : "bad";
        health.textContent = `${unusable} of ${reg.surfaces.length} ${reg.surfaces.length === 1 ? "app" : "apps"} couldn't be shown`;
      } else { health.className = healthBefore.className; health.textContent = healthBefore.text; }
    };
    draw(false, null);
    if (failed || title || unusable > 0) {
      fetch("/api/studio/place", { cache: "no-store", credentials: "same-origin" }).then(async (r) => {
        // A door that refuses the place too is a hosted Studio's (a local one always answers its own browser).
        if (r.status === 401 || r.status === 403) return draw(true, null);
        if (!r.ok) return;
        const place = await r.json().catch(() => null);
        if (place?.profile === "hosted") draw(true, place.account ?? null);
      }).catch(() => {});
    }
  }

  const tabsEl = document.getElementById("tabs");
  const stage = document.getElementById("stage");
  let activeId = null;
  const byId = (id) => surfaces.find((s) => s.id === id);

  // BEGIN WORKSPACE SURFACE PROTOCOL
  function setWorkspaceLayout(on) {
    document.body.classList.toggle("workspace-canvas", on);
    if (on) {
      document.querySelector("#chat-panel [data-close]")?.click();
      if (document.getElementById("agents")?.classList.contains("open")) document.getElementById("agentsWord")?.click();
    }
  }
  function notifyWorkspace() {
    const frame = frames.get(activeId); if (!frame) return;
    const url = new URL(location.href);
    const route = url.searchParams.get("s") === activeId && url.searchParams.has("view") ? url.searchParams.get("view") : workspaceRoutes.get(activeId) || "";
    frame.contentWindow.postMessage({ t: "workspace-context", id: activeId, route,
      surfaces: surfaces.map(s => ({id:s.id, name:s.name, glyph:s.glyph || ""})),
      links: [...document.querySelectorAll("#shellHalf a[href]")].map(a => ({label:a.textContent.trim(),href:a.href})) }, location.origin);
  }
  addEventListener("message", e => {
    const current = frames.get(activeId);
    if (!current || e.source !== current.contentWindow || e.origin !== location.origin || !e.data || typeof e.data !== "object") return;
    if (e.data.t === "surface-layout" && ["workspace", "default"].includes(e.data.layout)) {
      workspaceLayouts.set(activeId,e.data.layout); setWorkspaceLayout(e.data.layout === "workspace"); notifyWorkspace();
    }
    if (e.data.t === "workspace-context") notifyWorkspace();
    if (e.data.t === "surface-route" && typeof e.data.value === "string" && e.data.value.length <= 512) {
      workspaceRoutes.set(activeId,e.data.value);
      const url = new URL(location.href); url.searchParams.set("s",activeId);
      if (e.data.value) url.searchParams.set("view",e.data.value); else url.searchParams.delete("view");
      history[e.data.replace ? "replaceState" : "pushState"]({...history.state,s:activeId,view:e.data.value},"",url);
      notifyWorkspace();
    }
    if (e.data.t === "open-surface-view" && byId(e.data.id) && typeof e.data.value === "string" && e.data.value.length <= 512) {
      workspaceRoutes.set(e.data.id,e.data.value);
      activate(e.data.id);
    }
    if (e.data.t === "reload-workspace") location.reload();
  });
  document.addEventListener("chat:view", e => {
    if (document.body.classList.contains("workspace-canvas") && e.target?.id === "chat-panel" && e.detail?.open) e.target.querySelector("[data-close]")?.click();
  });
  // END WORKSPACE SURFACE PROTOCOL


  // OPEN A SURFACE AT A PLACE: a fragment for the surface's own page (#i=<ask>, #open=<path>), asked for by one of this
  // Studio's app frames or by the address (/?s=<id>&h=<fragment>). Only '#' then a safe set, at most 1024 characters: never a
  // URL, a query or markup. Anything else is ignored, and the console says so once per kind of refusal.
  const PLACE = /^#[A-Za-z0-9%._~!*'()=&-]{0,1023}$/;
  const placeOf = (h) => (typeof h === "string" && PLACE.test(h) ? h : null);
  const ignore = (why) => { if (!refused.has(why)) { refused.add(why); console.warn("shell: open-surface ignored: " + why); } };
  const at = (s, place) => (place ? s.url.split("#")[0] + place : s.url);

  // A PROJECT APP ON ITS OWN ORIGIN signs in at top level once per browser session, before it can load in a frame (its sign-in
  // can't complete inside one). Only the owner-declared shape uses this hop: https (or loopback http), a different origin, a
  // path /project-apps/<id>/. The app's own listener sends the person back here (its /_openrig/auth-return).
  function projectAuth(s) {
    try {
      const app = new URL(s.url, location.href), key = `openrig-project-auth-once-v1:${app.origin}:${s.id}`;
      if (app.origin === location.origin || app.protocol !== "https:" && !(app.protocol === "http:" && ["127.0.0.1", "localhost"].includes(app.hostname)) || !/^[a-z0-9][a-z0-9-]{0,39}$/.test(s.id) || !app.pathname.startsWith(`/project-apps/${s.id}/`)) return null;
      if (sessionStorage.getItem(key) === "1") return null;
      return { key, url: new URL("/_openrig/auth-return", app.origin) };
    } catch { return { blocked: true }; }
  }
  function prepareProject(s, auth, turn) {
    const empty = document.getElementById("empty");
    empty.style.display = "grid"; empty.textContent = `Opening ${s.name}…`;
    try {
      if (turn !== projectHop || activeId !== s.id) return;
      // Leaving this page must not lose what the person was typing to an agent: a chat panel saves its draft first, and one
      // that can't say it did stops the hop.
      if (auth.blocked || appChat && typeof appChat.checkpoint !== "function") throw Error("checkpoint unavailable");
      if (appChat?.checkpoint()) throw Error("draft not saved");
      sessionStorage.setItem(auth.key, "1");
      if (sessionStorage.getItem(auth.key) !== "1") throw Error("navigation bound not saved");
      auth.url.searchParams.set("studio", location.href);
      // A terminal page asks "Leave site?" when it unloads; removing its frame doesn't, and Terminal loads again on return.
      for (const [fid, f] of [...frames]) if (fid !== s.id && holdsTerminal(f)) { f.remove(); frames.delete(fid); placed.delete(fid); loadedSurfaces.delete(fid); }
      location.assign(auth.url.href);
    } catch {
      if (turn !== projectHop || activeId !== s.id) return;
      empty.textContent = "The app couldn't be opened automatically. Your message is still here; copy it before leaving this page.";
    }
  }

  function activate(id, fromNav, place = null, restoring = false) {
    const s = byId(id); if (!s) return;
    if (!fromNav && (activeId !== id || place)) {
      try { history.pushState({ s: id, h: place }, "", "?s=" + encodeURIComponent(id) + (place ? "&h=" + encodeURIComponent(place) : "")); } catch {}
    }
    if (s.popout) { window.open(at(s, place), "os-" + s.id); return; }
    // The chat panel follows the app: its conversation closes, and it addresses this app from now on.
    if (appChat) { try { appChat.close?.(); Promise.resolve(appChat.setApp?.(id)).catch(() => {}); } catch {} }
    activeId = id;
    if (fromNav) workspaceRoutes.set(id,new URL(location.href).searchParams.get("view") || "");
    else if (workspaceRoutes.get(id)) {
      const routeUrl=new URL(location.href); routeUrl.searchParams.set("view",workspaceRoutes.get(id));
      history.replaceState({...history.state,s:id,view:workspaceRoutes.get(id)},"",routeUrl);
    }
    setWorkspaceLayout(workspaceLayouts.get(id) === "workspace");
    const hop = ++projectHop, auth = projectAuth(s);
    document.getElementById("empty").style.display = "none";
    // unmountOnBlur rows release their frame when backgrounded (terminal-
    // style surfaces must not keep hidden attached clients alive)
    for (const [fid, f] of frames) {
      if (fid !== id && (byId(fid) || {}).unmountOnBlur) { f.remove(); frames.delete(fid); placed.delete(fid); }
    }
    if (auth) {
      for (const f of frames.values()) f.classList.add("hidden");
      prepareProject(s, auth, hop);
    } else if (!frames.has(id)) {
      const f = document.createElement("iframe");
      f.src = at(s, place); f.title = s.name;
      stage.appendChild(f); frames.set(id, f); loadedSurfaces.set(id, s);
      if (place) placed.set(id, place); else placed.delete(id);
    } else if (place) {
      // Same page, new fragment: the surface hears hashchange, without a reload. replace(), not src=, so the frame adds no
      // history entry of its own and Back undoes the whole move in one step (the shell's pushState above is the only entry).
      const f = frames.get(id);
      try { f.contentWindow.location.replace(at(s, place)); } catch { f.src = at(s, place); }
      placed.set(id, place);
    } else if (restoring && placed.has(id)) {
      // Back or Forward to an entry with no place, onto a frame the shell had put at one: take the place off again, so the
      // address and the page agree. Only the shell's own fragment is undone; a fragment the surface has since set itself is
      // its own state and stays. "#" keeps it a fragment move (no reload), as above.
      const f = frames.get(id), was = placed.get(id); placed.delete(id);
      let now = was; try { now = f.contentWindow.location.hash; } catch {}

    // the moment either changed.

    // surface declared overrides them. Restoring before the defaults meant the

    // replaced by the manifest hint, which reads as correct and is not.

  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    for (const s of surfaces) {
      const b = document.createElement("button");
      b.className = "tab"; b.dataset.id = s.id;
      b.innerHTML = `<span class="glyph">${s.glyph || "□"}</span><span class="name">${s.name}</span><span class="dot" id="dot-${s.id}"></span>`;
      b.title = s.hint || "";

  }
  renderTabs();

  // liveness dots: an opaque no-cors fetch succeeds iff something answers
  async function pulse() {
    await Promise.all(surfaces.map(async (s) => {
      const dot = document.getElementById("dot-" + s.id); if (!dot) return;
      try { await fetch(s.url, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(2500) });
        dot.className = "dot live"; } catch { dot.className = "dot down"; }
    }));
  }
  pulse(); setInterval(pulse, 15000);

  // BEGIN SIGN-IN RENEWAL
  // A sign-in in front of this Studio (server hooks, contract/server-hooks.md) can end while the page is open, and the
  // page never hears of it: every read is refused or redirected to the sign-in, which a page sees only as a failed
  // fetch, and every app fails in its own words. So one cheap read of this Studio's own, without following a redirect,
  // is made now and then and when the tab comes back, and the person gets one answer for the whole page:
  //   - a 403 that says `x-openrig-front-door: renew` (the sign-in can be renewed without asking the person): the page
  //     reloads, at most once per 30 s; a renewal refused again inside that window shows the notice instead;
  //   - a redirect, 401 or 403: one notice over the page, "Your sign-in has ended", with "Sign in again" (a reload);
  //   - an answer again (signed in from another tab, say): the notice goes; the page underneath was never touched.
  // A Studio with no sign-in in front answers this read, so it never shows anything.
  const signInHasEnded = (r) => r.type === "opaqueredirect" || r.status === 401 || r.status === 403;
  // Whether a frame shows a terminal (ttyd), directly or in a same-origin page of its own. A terminal page asks "Leave
  // site?" when it unloads, which would hold the reload behind a prompt the person didn't ask for.
  function holdsTerminal(frame, depth = 0) {
    try {
      const p = new URL(frame.src || "about:blank", location.href).pathname;
      if (["/terminal/", "/team/", "/chat/", "/agents/"].some((x) => p.startsWith(x)) || p === "/surfaces/terminal.html") return true;
      return depth < 3 && [...(frame.contentDocument?.querySelectorAll("iframe") || [])].some((f) => holdsTerminal(f, depth + 1));
    } catch { return false; }
  }
  function releaseTerminals() {
    for (const [id, f] of [...frames]) if (holdsTerminal(f)) { f.remove(); frames.delete(id); placed.delete(id); }
    const seatFrame = document.getElementById("chatframe");
    if (seatFrame?.getAttribute("src")) {
      const bare = document.createElement("iframe");
      bare.id = "chatframe"; bare.title = "agent seat";
      bare.setAttribute("allow", "clipboard-read; clipboard-write");
      seatFrame.replaceWith(bare);
    }
  }
  function noticeSignInEnded(on) {
    const shown = document.getElementById("signInEnded");
    if (!on) { shown?.remove(); return; }
    if (shown) return;
    const veil = document.createElement("div"), card = document.createElement("div"), title = document.createElement("h2"), line = document.createElement("p"), again = document.createElement("button");
    veil.id = "signInEnded"; card.setAttribute("role", "alertdialog"); card.setAttribute("aria-modal", "true"); card.setAttribute("aria-labelledby", "signInEndedTitle");
    title.id = "signInEndedTitle"; title.textContent = "Your sign-in has ended";
    line.textContent = "Sign in again to carry on. Your open apps are kept until you do.";
    again.type = "button"; again.textContent = "Sign in again"; again.onclick = () => location.reload();
    card.append(title, line, again); veil.append(card); document.body.append(veil); again.focus();
  }
  function renewSignIn(r) {
    if (r.status !== 403 || r.headers.get("x-openrig-front-door")?.trim().toLowerCase() !== "renew") return false;
    // A reload is already on its way: nothing more. It is cleared by the next good answer, so renewing never stops for good.
    if (renewingSignIn) return true;
    // Navigate once; never replay a request. A short guard across reloads in case the renewed sign-in is refused too.
    const now = Date.now();

    try {
      last = Number(sessionStorage.getItem("openrig.renewAt")) || 0;

  }
  async function checkSignIn() {
    let r;
    try {
      r = await fetch("/api/studio/place", { method: "HEAD", cache: "no-store", credentials: "same-origin", redirect: "manual", signal: AbortSignal.timeout(4000) });
    } catch { return; }   // no answer at all says nothing about the sign-in
    if (renewSignIn(r)) return;
    if (signInHasEnded(r)) { noticeSignInEnded(true); return; }
    if (r.ok) { noticeSignInEnded(false); renewingSignIn = false; }
  }

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") void checkSignIn(); });

  // BEGIN LIVE APP DISCOVERY
  // Apps installed, updated or removed while this page is open (the Studio activates them live; contract/manifest.md)
  // reach the rail within a couple of seconds, without a reload. Only an app whose row changed (its address or its
  // revision) gets a new document; every other open app keeps its frame, scroll and unsaved input. A read that fails
  // keeps the last app list, and says so only once it has failed three times running.
  let discovering = false, discoveryMisses = 0;
  async function discoverApps() {
    if (discovering) return;
    discovering = true;
    try {
      const response = await fetch("/api/contract", { cache: "no-store", credentials: "same-origin", redirect: "manual", signal: AbortSignal.timeout(4000) });
      if (renewSignIn(response)) return;
      if (signInHasEnded(response)) { noticeSignInEnded(true); return; }
      if (!response.ok) throw new Error("The workspace app list could not be checked.");
      const nextMeta = await response.json();
      if (!nextMeta.manifest || typeof nextMeta.manifest !== "object") throw new Error("The updated app list could not be read. Your open apps were kept.");
      const registry = await fetch("/surfaces.json", { cache: "no-store", credentials: "same-origin", redirect: "manual", signal: AbortSignal.timeout(4000) });
      if (renewSignIn(registry)) return;
      if (signInHasEnded(registry)) { noticeSignInEnded(true); return; }
      if (!registry.ok) throw new Error("The workspace app list could not be checked.");
      const next = await registry.json();
      if (!Array.isArray(next.surfaces)) throw new Error("The updated app list could not be read.");
      const rows = next.surfaces.filter((s) => s && s.id && (s.url || (typeof s.path === "string" && s.path.startsWith("/"))))
        .map((s) => s.url ? s : ({ ...s, url: location.origin + s.path }));
      if (rows.length !== next.surfaces.length) throw new Error("The updated app list is incomplete. Your open apps were kept.");
      noticeSignInEnded(false); renewingSignIn = false; discoveryMisses = 0;

      meta = nextMeta;

  }
  setInterval(discoverApps, 2000);
  // END LIVE APP DISCOVERY

  // deep link
  const params = new URLSearchParams(location.search), qs = params.get("s"), qh = params.get("h");
  if (qh !== null && !placeOf(qh)) ignore("the address's h= isn't a safe fragment");
  if (byId(qs)) activate(qs, true, placeOf(qh));
  else { if (qs) ignore("the address names no surface on this Studio"); if (surfaces[0]) activate(surfaces[0].id, true); }
  addEventListener("popstate", (e) => {
    const p = new URLSearchParams(location.search);
    const id = (e.state && e.state.s) || p.get("s"), h = e.state ? e.state.h : p.get("h");
    if (id && byId(id)) activate(id, true, placeOf(h), true);
  });

  // --- the shell protocol: the ONLY surface->shell API --------------------
  addEventListener("message", (e) => {
    // A surface on another origin (a generated app on its own listener, say) can't borrow this
    // page's controls: they act as the signed-in person on this Studio.
    if (e.origin !== location.origin) return;
    if (!e.data || typeof e.data !== "object") return;
    // Only this Studio's own app frames may switch its surface, with a place or without: a stray frame could otherwise move
    // the person to another surface.
    if (e.data.t === "open-surface") {
      if (![...frames.values()].some((f) => f.contentWindow === e.source)) ignore("only this Studio's own app frames may open a surface");
      else if (!byId(e.data.id)) ignore("not a surface on this Studio");
      else if (e.data.hash === undefined) activate(e.data.id);
      else if (!placeOf(e.data.hash)) ignore("the place isn't a safe fragment ('#' then letters, digits and %._~!*'()=&-, at most 1024)");
      else activate(e.data.id, false, e.data.hash);
    }
    if (e.data.t === "open-agent") openAgents(e.data.seat);
    // A surface may ASK for markup, exactly as it may already summon the agent
    // sidebar. Both are studio-level controls the shell owns and the surface has a
    // legitimate reason to want: a surface that opens an artifact in its own modal
    // knows the user is looking at something markable, and the only route before
    // this was the user knowing to reach for the header.
    //
    // It is a REQUEST, not a seizure — the shell still owns the state, only the
    // ACTIVE surface is heard, and the button stays the visible truth. A surface
    // cannot read markup state or force it off for the user.
    if (e.data.t === "open-markup") {
      const current = frames.get(activeId);
      if (current && e.source === current.contentWindow) setMarkup(e.data.on !== false);
    }
    if (e.data.t === "annotation-refresh") {
      // CHEAP AND EXPLICIT. DOM motion inside a surface is invisible from out
      // here: an element that MOVES changes neither the frame's size nor its
      // scroll, so nothing fires and anchored marks sit at the old geometry until
      // something unrelated forces a repaint (a window resize, for example).
      //
      // This does not reload the board and does not touch undo history. Re-posting
      // annotation-target with the SAME frame id stays a no-op deliberately —
      // overloading it as a nudge would make every redundant declaration re-anchor
      // and reset undo, so the nudge gets its own verb.
      const current = frames.get(activeId);
      if (current && e.source === current.contentWindow) {
        for (const fn of refreshListeners) { try { fn(); } catch {} }
      }
    }
    if (e.data.t === "annotation-target") {
      // Same active-surface guard as the header and the context, for the same
      // reason: a backgrounded surface still holds a live channel.
      const current = frames.get(activeId);
      if (current && e.source === current.contentWindow) {
        const frameId = typeof e.data.frame === "string" && e.data.frame ? e.data.frame : null;

      // are looking at.
      const current = frames.get(activeId);
      if (current && e.source === current.contentWindow) {

  });

  // --- agent sidebar: a real seat's session in a frame -------------------
  // BEGIN AGENT SIDEBAR
  // The multiplayer surface — a human and the agents that wrote the app, on the
  // same screen — is the point of this SDK, so it lives here in the shell
  // rather than inside any one app's provider.
  //
  // Degrades honestly in three distinguishable ways, because "no seats" has
  // more than one cause and a surface can only act on the difference if it is
  // told which: no roster declared at all, a roster with no terminal endpoint
  // (so seats are listed but not attachable), and a working attach.

  // origin otherwise. That worked on the machine it was written on and would
  // have broken the moment a studio was reached through anything else, because
  // nothing served /chat — the sidebar would have asked the studio for a

  // tested locally is the same path that runs remotely, and a proxy in front
  // needs exactly one rule instead of one per port.

  // at all.
  const attachable = Boolean(seats.length && termPort);

  // lands on a stopped member whenever the first one happens to be down, and the

  const canAttach = (s) => s.status === undefined || s.status === "running";
  const firstUp = seats.find(canAttach) || seats[0];

  const rigs = [...new Set(seats.map((s) => rigOf(s.seat)))].filter(Boolean);
  // A box may declare which rig the launcher opens on. Where one rig is the
  // reason someone opens the launcher and the others are plumbing, discovery
  // order buries it; `primaryRig` lets the box say so. Absent, order is left
  // alone — no rig name is built into the shell.
  const primary = reg.primaryRig;
  if (primary && rigs.includes(primary)) {

  }

  const rosterLine = () =>

  function renderTiles() {

    sel.style.display = rigs.length > 1 ? "" : "none";

      // A roster row may carry `status`. Absent means the source did not say, and
      // an unknown status is treated as attachable — the alternative is greying

      // path the broken-looking one.

      // With no terminal endpoint every member is still listed, marked not attachable, rather than hidden.

      // is active — it leaves the previous rig's team on screen, so switching
      // rigs appeared to do nothing.

  }

  function sync() {
    document.getElementById("seatName").textContent = seat || "";
    for (const el of document.getElementById("seatTiles").children) {

    }
    if (!attachable || !seat) return;

    if (frame.dataset.url === chatUrl(seat)) return;

    // previous terminal attached to its seat; replacing detaches it cleanly.

  function openAgents(want) {
    if (want && seats.some((s) => s.seat === want)) { seat = want; chatRig = rigOf(want) || chatRig; }
    if (!seats.length) {
      agentsBody.innerHTML = seatsFrom === "none"
        ? `<div>no agents</div><div class="honest">No rig is attached to this Studio and it declares no roster. The Studio's startup log says why there is no rig.</div>`

      agentsBody.innerHTML = `<div>${esc(rosterLine())}, not attachable</div>`

  // --- the two shell frames -------------------------------------------------
  // COLLAPSE IS REMEMBERED. A layout choice that resets on every reload is one

  // a setting anyone has to manage.
  const railBtn = document.getElementById("railToggle");
  const setRail = (collapsed) => {
    document.body.classList.toggle("rail-collapsed", collapsed);
    // THE GLYPH IS MARKUP AND STAYS MARKUP. This used to assign textContent, which
    // ran on boot and DESTROYED the inline SVG before anyone saw it — the button
    // was replaced by a hamburger character no matter what the markup said. The
    // served HTML and the live DOM disagreed, which is why reading either one
    // alone gets you the wrong answer. Direction is conveyed by mirroring the
    // glyph in CSS; only the label changes here.
    railBtn.title = collapsed ? "expand the launcher" : "collapse the launcher to a toolstrip";
    railBtn.setAttribute("aria-label", railBtn.title);
    try { sessionStorage.setItem("shell.rail", collapsed ? "1" : "0"); } catch {}
  };
  const phoneRail = window.matchMedia?.("(max-width: 700px)");
  setRail(phoneRail?.matches || (() => { try { return sessionStorage.getItem("shell.rail") === "1"; } catch { return false; } })());
  phoneRail?.addEventListener("change", e => { if (e.matches) setRail(true); });
  railBtn.onclick = () => setRail(!document.body.classList.contains("rail-collapsed"));

  // The phone drawer (the CSS above says when it applies). Opening moves focus to the open surface's item; closing brings it
  // back to the menu button when it was inside, so focus is never left on a hidden control. Choosing a surface closes it.
  const navMenu = document.getElementById("navMenu"), railEl = document.getElementById("rail");
  const drawer = (open) => {
    // The drawer is always the full rail; closed, a narrow screen's rail is the toolstrip again.
    if (open) document.body.classList.remove("rail-collapsed");
    else if (phoneRail?.matches) document.body.classList.add("rail-collapsed");
    const inside = railEl.contains(document.activeElement);
    document.body.classList.toggle("navDrawer", open);
    navMenu.setAttribute("aria-expanded", String(open));
    navMenu.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    if (open) (tabsEl.querySelector(".tab.active") || tabsEl.querySelector(".tab:not([disabled])"))?.focus();
    else if (inside) navMenu.focus();
  };
  navMenu.onclick = () => drawer(!document.body.classList.contains("navDrawer"));
  document.getElementById("navScrim").onclick = () => drawer(false);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("navDrawer")) drawer(false); });
  tabsEl.addEventListener("click", (e) => { if (e.target.closest(".tab")?.dataset.id) drawer(false); });

  // MARKUP is the shell asking the SURFACE to annotate. The shell does not draw
  // the annotations — it does not know what they would attach to — so this is
  // intent, sent to the active surface, and the surface answers by doing it or by
  // not being able to. A surface that ignores it is unaffected, like every other
  // opt-in here.
  //
  // Deliberately NOT persisted across surfaces: annotate-mode belongs to the thing
  // you are annotating, and carrying it into the next surface would turn a mode you
  // set once into one you keep meeting.
  const markupBtn = document.getElementById("markupToggle");
  let markupOn = false;
  const tellSurface = (msg) => {
    const f = frames.get(activeId);
    // Only to a surface on this Studio's own origin: another origin gets no control messages.
    if (f && f.contentWindow) { try {
      if (new URL(f.src, location.href).origin === location.origin) f.contentWindow.postMessage(msg, location.origin);
    } catch {} }
  };
  // ONE PATH for the click and the message. Two places flipping this state is two
  // places computing one property, and the second one always forgets a listener.
  const setMarkup = (on) => {
    if (markupOn === Boolean(on)) return;
    markupOn = Boolean(on);
    markupBtn.classList.toggle("on", markupOn);
    tellSurface({ t: "markup", on: markupOn });
    for (const fn of markupListeners) { try { fn(markupOn); } catch {} }
  };
  markupBtn.onclick = () => setMarkup(!markupOn);

  // --- the seam a shell-level feature attaches to ---------------------------
  // ANNOTATION AND ANYTHING LIKE IT IS A SHELL FEATURE, NOT A SURFACE ONE, and
  // this seam exists to keep it that way. If annotating required the surface to
  // cooperate then "any surface is annotatable" would be false the moment a
  // surface did not implement it — including every surface that already exists.
  // So the overlay host sits OVER the stage, in the shell, and works on a surface
  // that knows nothing about it.
  //
  // The MARKUP button belongs to the shell and stays there: a feature mounting
  // here SUBSCRIBES to it rather than adding a second control that can disagree
  // with the first.
  // --- the app half of the header ------------------------------------------
  // A surface DECLARES what belongs in its half; the shell renders it. Declaring
  // rather than drawing is what keeps one header on screen: the surface cannot
  // produce a second bar, and the shell cannot be surprised by markup it did not
  // write.
  //
  // Sent over the existing surface->shell channel because that is already the only
  // one, and because a manifest field could not do this job — an action's LABEL and
  // its ON state change while the surface runs, and a static declaration would go
  // stale the first time a surface toggled something.
  //
  // ONLY THE ACTIVE SURFACE MAY WRITE THE HEADER. A background frame is still
  // running and still holds a live channel, so without this check the header shows
  // whichever surface spoke last rather than the one you are looking at.
  const appActionsEl = document.getElementById("appActions");
  // HOW MANY ACTIONS FIT. The left half shares one fixed bar with the title, the
  // crumb and the shell's own half, so this is bounded rather than unbounded — an
  // unlimited list pushes into controls the surface does not own.
  //
  // THE BOUND IS FINE; THE SILENCE WAS THE DEFECT. This used to slice and say
  // nothing, so a surface declaring seven actions rendered six and had no way to
  // find out: not in the DOM it cannot see, not in any response, not anywhere. The
  // seventh button simply never worked, which reads as a bug in the app.
  const HEADER_ACTION_LIMIT = 6;
  function renderAppHeader(decl) {
    if (decl.title !== undefined) document.getElementById("topTitle").textContent = decl.title;
    if (decl.crumb !== undefined) document.getElementById("topCrumb").textContent = decl.crumb;
    if (!Array.isArray(decl.actions)) return;
    // Told twice, because the two channels reach different people: the console
    // reaches whoever is building the app right now, and the message reaches the
    // APP, which is the only one that can actually adapt. Answering "an app cannot
    // see the cap to respect it" needs the second one.
    if (decl.actions.length > HEADER_ACTION_LIMIT) {
      const dropped = decl.actions.slice(HEADER_ACTION_LIMIT).map((a) => a?.id ?? a?.label ?? "(unnamed)");
      console.warn(
        `studio shell: the header shows at most ${HEADER_ACTION_LIMIT} app actions; ` +
        `${dropped.length} were dropped: ${dropped.join(", ")}. ` +
        `Declare fewer, or move the rest into the surface.`);
      tellSurface({ t: "header-overflow", limit: HEADER_ACTION_LIMIT,
                    declared: decl.actions.length, dropped });
    }
    appActionsEl.replaceChildren(...decl.actions.slice(0, HEADER_ACTION_LIMIT).map((a) => {
      const btn = document.createElement("button");
      btn.textContent = String(a.label ?? a.id ?? "");
      btn.title = String(a.title ?? "");
      if (a.on) btn.classList.add("on");
      if (a.disabled) btn.disabled = true;
      // The click goes BACK to the surface. The shell does not know what any of
      // these mean and must not start guessing.
      btn.onclick = () => tellSurface({ t: "header-action", id: a.id });
      return btn;
    }));
  }

  const overlayHost = document.createElement("div");
  overlayHost.id = "shell-overlay";
  document.getElementById("stage").appendChild(overlayHost);
  window.studioShell = {
    // Where to draw. Pointer events are OFF on the host, so an idle overlay
    // cannot swallow clicks meant for the surface underneath; a feature that
    // wants input sets them on its own node.
    overlay: overlayHost,
    // Which surface is showing, and its frame. Read at CALL time — the active
    // surface changes under a long-lived feature.
    active: () => ({ id: activeId, frame: frames.get(activeId) || null,
                     context: declaredContexts.get(activeId) ?? null }),
    // The persistence key, composed HERE rather than by each feature. Two features
    // composing it independently is two places computing one property, and they
    // drift silently. NUL cannot occur in a surface id or a declared context, so
    // "a" + "b\0c" and "a\0b" + "c" cannot collide.
    // WHERE A FEATURE SHOULD LOOK FOR ELEMENTS, and the rect of that document in
    // TOP-WINDOW coordinates.
    //
    // Normally the active surface's own frame. When the surface has declared a
    // same-origin nested frame, this resolves the CHAIN — a nested frame's
    // getBoundingClientRect is relative to its parent's viewport, not to the top
    // window, so the offsets have to be added. Resolving it here rather than in
    // each feature keeps that walk in one place; two features doing it
    // independently is two places computing one property.
    //
    // Falls back to the surface frame whenever the target is absent, not an
    // iframe, or CROSS-ORIGIN — a cross-origin document cannot be read for
    // element identity, and pretending otherwise would produce anchors that
    // silently never resolve.
    target: () => {
      const outer = frames.get(activeId);
      if (!outer) return null;
      const outerRect = outer.getBoundingClientRect();
      // The surface's OWN document, element-anchorable. Used when no nested
      // target is declared, or the declared one is not a frame.
      const surfaceDoc = () => {
        try { return outer.contentDocument ? { doc: outer.contentDocument, rect: outerRect } : null; }
        catch { return null; }
      };
      const frameId = declaredTargets.get(activeId) ?? null;
      if (!frameId) return surfaceDoc();
      try {
        const nested = outer.contentDocument?.getElementById(frameId);
        if (!nested || nested.tagName !== "IFRAME") return surfaceDoc();
        let doc = null;
        try { doc = nested.contentDocument; } catch { doc = null; }
        if (doc) {
          const innerRect = nested.getBoundingClientRect();
          return { doc, rect: {
            left: outerRect.left + innerRect.left, top: outerRect.top + innerRect.top,
            width: innerRect.width, height: innerRect.height } };
        }
        // CROSS-ORIGIN declared target: SPATIAL-ONLY. Its document cannot be
        // read for element identity, so it must NOT fall back to the surface
        // document — a record's selector was meant for the cross-origin frame,
        // and resolving it against the outer host is the exact false anchor the
        // contract forbids (a host and its nested doc both carrying `#publish`
        // would anchor to the wrong one). A rect for spatial marks, no doc.
        return { spatialOnly: true, rect: outerRect };
      } catch { return surfaceDoc(); }
    },
    scope: () => {
      const context = declaredContexts.get(activeId) ?? null;
      return activeId ? (context ? activeId + "\u0000" + context : activeId) : null;
    },
    // Is markup mode on, and tell me when it changes.
    markup: () => markupOn,
    onMarkup: (fn) => { markupListeners.add(fn); return () => markupListeners.delete(fn); },
    // Tell me when the surface changes, so an overlay can clear or re-anchor.
    onSurface: (fn) => { surfaceListeners.add(fn); return () => surfaceListeners.delete(fn); },
    // Re-measure without reloading. Fired when the active surface says its layout
    // moved; a feature drawing over the stage recomputes geometry and repaints.
    onRefresh: (fn) => { refreshListeners.add(fn); return () => refreshListeners.delete(fn); },
  };
  // --- annotations: a SHELL feature, drawn over the stage --------------------
  // Annotation belongs to the shell rather than to each surface because it must
  // work on surfaces that know nothing about it — the ones that already exist.
  // It attaches at the seam like any other feature and gets no privileges.
  //
  // The store is injected from HERE, not built into the layer: the layer must
  // stay free of any transport so it runs against a runtime that has no
  // annotations verb at all. That runtime gets an in-memory board that SAYS
  // "session only" rather than a broken one.
  try {
    const capable = Array.isArray(meta?.capabilities) && meta.capabilities.includes("annotations.write");
    const store = capable ? {
      load: async (scope) => {
        const r = await fetch("/api/annotations?scope=" + encodeURIComponent(scope), { cache: "no-store" });
        const j = await r.json();
        return Array.isArray(j?.records) ? j.records : [];
      },
      save: async (scope, records) => {
        const r = await fetch("/api/annotations", { method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ scope, records }) });
        const j = await r.json().catch(() => null);
        // A save that failed must not look like one that worked. The layer shows
        // "persisted" while a store is present, so a silent failure here would
        // make that label a lie.
        if (!j?.ok) throw new Error(j?.error || "annotations save failed");
      },
    } : null;
    const { attach } = await import("./annotations.js");
    // The persistence DISCLOSURE, forwarded so the label reflects whether marks
    // survive a restart — not merely that a store exists. A memory runtime is
    // write-capable but volatile; passing store alone once showed it "persisted".
    window.studioAnnotations = attach(window.studioShell, { store, persistence: meta?.annotations?.persistence ?? null });
  } catch (err) {
    // The shell keeps working without annotations. It must not take the studio
    // down with it, and it must not pretend it loaded.
    console.error("annotations did not attach:", err);
  }

  document.getElementById("agentsWord").onclick = () => {
    agents.classList.remove("open");
    document.getElementById("agentToggle").style.display = "";
    // RELEASE the terminal on close. Hiding the panel leaves the connection
    // open, and a hidden viewer still counts as an attached client — it fights
    // the visible one for size, and viewer sessions accumulate for as long as
    // the tab lives. Measured: closing the sidebar left an attached viewer
    // behind; a real disconnect cleaned it up correctly. Costs about a second
    // to re-attach on reopen, which is the trade the original made too.
    // Build a bare replacement rather than cloning: cloneNode copies the src
    // attribute, so the "fresh" frame reconnects immediately and releases
    // nothing. Attributes are re-applied except src, which is what detaches.
    const frame = document.getElementById("chatframe");
    if (frame && frame.getAttribute("src")) {
      const bare = document.createElement("iframe");
      bare.id = "chatframe"; bare.title = "agent seat";
      bare.setAttribute("allow", "clipboard-read; clipboard-write");
      frame.replaceWith(bare);
    }
  };

  // BEGIN CHAT PANEL
  // The chat panel comes from a provider that serves /collab-assets/ (an app's provider declares it). The shell imports
  // it unless the page says nothing here serves it (a meta named openrig-chat-panel with the content none, which a
  // server hook's shell transform adds when no provider does; never written in this file, so finding the tag in a page
  // always means a transform put it there): then it isn't asked for, and with no seats either the agents
  // button is left out, since it would open an empty roster. A panel that's served but fails to load keeps the button
  // and its roster. A contextual panel becomes this shell's Agent: the button opens it, it follows the active app, and
  // it can open another app.
  const CHAT_PANEL = "/collab-assets/chat-panel/panel.js";
  const chatPanelOff = () => !!document.querySelector('meta[name="openrig-chat-panel"][content="none"]');
  async function mountChatPanel(load) {
    if (chatPanelOff()) { if (!seats.length) document.body.classList.add("no-agent-route"); return null; }
    let mod;
    try { mod = await load(CHAT_PANEL); } catch { return null; }
    if (typeof mod?.mount !== "function") return null;
    const panel = mod.mount({ app: activeId || surfaces[0]?.id, root: stage, initialOpen: false, workspace: true, surfaces });
    await panel.ready;
    if (!panel.roster?.()?.contextual) return panel;
    appChat = panel;
    document.body.classList.add("workspace-chat");
    const toggle = document.getElementById("agentToggle");
    toggle.textContent = "Agent"; toggle.title = "Chat or terminal with this app's agent";
    toggle.onclick = () => panel.open();
    stage.addEventListener("chat:surface", (e) => { if (e.target.id === "chat-panel" && byId(e.detail?.id)) activate(e.detail.id); });
    const paintChatView = (open) => {
      document.getElementById("topTitle").textContent = open ? "Conversation" : byId(activeId)?.name || "Studio";
      toggle.classList.toggle("on", open);
      for (const tab of tabsEl.children) tab.classList.toggle("active", !open && tab.dataset.id === activeId);
    };
    stage.addEventListener("chat:view", (e) => { if (e.target.id === "chat-panel") paintChatView(e.detail?.open); });
    // ready may have restored the conversation before the listener existed; paint that view too.
    paintChatView(document.body.classList.contains("chat-workspace-visible"));
    return panel;
  }
  // END CHAT PANEL
  mountChatPanel((u) => import(u)).catch(() => {});
})();
</script>
</body>
</html>
